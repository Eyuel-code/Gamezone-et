<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Tetris Matrix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #022c22, #020617, #000);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: min(90vw, 360px);
      margin-bottom: 10px;
    }
    .title { font-size: 20px; font-weight: 900; color: #10b981; text-shadow: 0 0 12px rgba(16, 185, 129, 0.6); }
    .stats { display: flex; gap: 10px; font-size: 13px; font-weight: 700; color: #6ee7b7; }
    #canvas-container {
      position: relative;
      border: 3px solid #059669;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.3), inset 0 0 20px rgba(0,0,0,0.8);
      background: #020617;
    }
    canvas { display: block; }
    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: min(90vw, 360px);
      margin-top: 10px;
    }
    .btn {
      padding: 12px 0;
      background: #0f172a;
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
      font-weight: 800;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
    }
    .btn:active { background: #059669; color: #020617; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">TETRIS</div>
    <div class="stats">
      <span>Score: <b id="score">0</b></span>
      <span>Lines: <b id="lines">0</b></span>
    </div>
  </div>
  <div id="canvas-container">
    <canvas id="tetris" width="240" height="400"></canvas>
  </div>
  <div class="controls">
    <button class="btn" onclick="playerMove(-1)">◄ Left</button>
    <button class="btn" onclick="playerRotate(1)">▲ Rotate</button>
    <button class="btn" onclick="playerMove(1)">► Right</button>
    <button class="btn" onclick="playerDrop()">▼ Drop</button>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    context.scale(20, 20);

    const arena = createMatrix(12, 20);
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let score = 0;
    let lines = 0;

    const colors = [
      null,
      '#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'
    ];

    const player = {
      pos: { x: 0, y: 0 },
      matrix: null,
      score: 0
    };

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    function createPiece(type) {
      if (type === 'T') return [[0,1,0],[1,1,1],[0,0,0]];
      if (type === 'O') return [[2,2],[2,2]];
      if (type === 'L') return [[0,3,0],[0,3,0],[0,3,3]];
      if (type === 'J') return [[0,4,0],[0,4,0],[4,4,0]];
      if (type === 'I') return [[0,5,0,0],[0,5,0,0],[0,5,0,0],[0,5,0,0]];
      if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
      if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
        });
      });
    }

    function arenaSweep() {
      let rowCount = 1;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        score += rowCount * 100;
        lines++;
        rowCount *= 2;
      }
      document.getElementById('score').innerText = score;
      document.getElementById('lines').innerText = lines;
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
            context.lineWidth = 0.05;
            context.strokeStyle = '#fff';
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = '#020617';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(arena, { x: 0, y: 0 });
      drawMatrix(player.matrix, player.pos);
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerReset() {
      const pieces = 'ILJOTSZ';
      player.matrix = createPiece(pieces[Math.floor(pieces.length * Math.random())]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        score = 0;
        lines = 0;
      }
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) playerDrop();
      draw();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') playerMove(-1);
      else if (event.key === 'ArrowRight') playerMove(1);
      else if (event.key === 'ArrowDown') playerDrop();
      else if (event.key === 'ArrowUp') playerRotate(1);
    });

    playerReset();
    update();
  </script>
</body>
</html>
