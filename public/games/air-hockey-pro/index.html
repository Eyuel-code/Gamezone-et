<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Air Hockey Neon 3D Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #1e1b4b, #0f172a, #030712);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: min(92vw, 400px);
      margin-bottom: 8px;
    }
    .score { font-size: 20px; font-weight: 900; }
    .score-p { color: #38bdf8; }
    .score-ai { color: #f43f5e; }
    #rink-container {
      position: relative;
      border: 4px solid #38bdf8;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4), inset 0 0 40px rgba(0,0,0,0.8);
      background: #020617;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="score score-ai">AI: <span id="score-ai">0</span></div>
    <div style="font-weight: 800; color: #a855f7;">AIR HOCKEY</div>
    <div class="score score-p">Player: <span id="score-p">0</span></div>
  </div>
  <div id="rink-container">
    <canvas id="rink" width="360" height="540"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('rink');
    const ctx = canvas.getContext('2d');

    const W = canvas.width;
    const H = canvas.height;

    let scoreP = 0;
    let scoreAI = 0;

    const puck = {
      x: W / 2,
      y: H / 2,
      vx: 0,
      vy: 4,
      r: 12
    };

    const player = {
      x: W / 2,
      y: H - 70,
      r: 26,
      vx: 0,
      vy: 0
    };

    const ai = {
      x: W / 2,
      y: 70,
      r: 26,
      speed: 3.5
    };

    function resetPuck(toAI) {
      puck.x = W / 2;
      puck.y = H / 2;
      puck.vx = (Math.random() - 0.5) * 4;
      puck.vy = toAI ? -4.5 : 4.5;
    }

    function update() {
      // Move puck
      puck.x += puck.vx;
      puck.y += puck.vy;

      // Friction
      puck.vx *= 0.995;
      puck.vy *= 0.995;

      // Wall bounce
      if (puck.x - puck.r < 0) { puck.x = puck.r; puck.vx *= -1; }
      if (puck.x + puck.r > W) { puck.x = W - puck.r; puck.vx *= -1; }

      // Goals (center opening: 120px to 240px)
      const goalMin = W / 2 - 60;
      const goalMax = W / 2 + 60;

      if (puck.y - puck.r < 0) {
        if (puck.x > goalMin && puck.x < goalMax) {
          scoreP++;
          document.getElementById('score-p').innerText = scoreP;
          resetPuck(true);
        } else {
          puck.y = puck.r;
          puck.vy *= -1;
        }
      }

      if (puck.y + puck.r > H) {
        if (puck.x > goalMin && puck.x < goalMax) {
          scoreAI++;
          document.getElementById('score-ai').innerText = scoreAI;
          resetPuck(false);
        } else {
          puck.y = H - puck.r;
          puck.vy *= -1;
        }
      }

      // AI movement
      const targetX = puck.x;
      const targetY = puck.y < H / 2 ? Math.max(50, puck.y - 30) : 70;
      ai.x += (targetX - ai.x) * 0.08;
      ai.y += (targetY - ai.y) * 0.08;
      ai.y = Math.min(ai.y, H / 2 - 40);

      // Collisions
      checkPaddleCollision(player);
      checkPaddleCollision(ai);

      draw();
      requestAnimationFrame(update);
    }

    function checkPaddleCollision(p) {
      const dx = puck.x - p.x;
      const dy = puck.y - p.y;
      const dist = Math.hypot(dx, dy);
      if (dist < puck.r + p.r) {
        const angle = Math.atan2(dy, dx);
        const speed = Math.min(12, Math.hypot(puck.vx, puck.vy) + 3);
        puck.vx = Math.cos(angle) * speed;
        puck.vy = Math.sin(angle) * speed;
        puck.x = p.x + Math.cos(angle) * (puck.r + p.r + 1);
        puck.y = p.y + Math.sin(angle) * (puck.r + p.r + 1);
      }
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, W, H);

      // Center line
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, H / 2);
      ctx.lineTo(W, H / 2);
      ctx.stroke();

      // Center circle
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, 50, 0, Math.PI * 2);
      ctx.stroke();

      // Goals
      ctx.fillStyle = '#f43f5e';
      ctx.fillRect(W / 2 - 60, 0, 120, 6);
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(W / 2 - 60, H - 6, 120, 6);

      // Player paddle
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();

      // AI paddle
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(ai.x, ai.y, ai.r, 0, Math.PI * 2);
      ctx.fill();

      // Puck
      ctx.fillStyle = '#facc15';
      ctx.shadowColor = '#facc15';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
    }

    function handlePointer(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (W / rect.width);
      const y = (clientY - rect.top) * (H / rect.height);
      player.x = Math.max(player.r, Math.min(W - player.r, x));
      player.y = Math.max(H / 2 + player.r, Math.min(H - player.r, y));
    }

    canvas.addEventListener('mousemove', e => handlePointer(e.clientX, e.clientY));
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      handlePointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    update();
  </script>
</body>
</html>
