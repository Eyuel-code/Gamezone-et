<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Impossible Tic-Tac-Toe AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: radial-gradient(circle at center, #0f172a, #090d16, #020408);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: min(90vw, 380px);
      margin-bottom: 16px;
    }
    .title { font-size: 20px; font-weight: 800; color: #22d3ee; text-shadow: 0 0 12px rgba(34, 211, 238, 0.5); }
    .status { font-size: 13px; font-weight: 700; color: #a855f7; padding: 4px 10px; background: rgba(168, 85, 247, 0.15); border-radius: 8px; border: 1px solid rgba(168, 85, 247, 0.3); }
    #board {
      width: min(90vw, 380px);
      height: min(90vw, 380px);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      background: #1e293b;
      padding: 12px;
      border-radius: 20px;
      border: 2px solid #334155;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8), 0 0 25px rgba(34, 211, 238, 0.15);
    }
    .cell {
      background: #0f172a;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(36px, 12vw, 64px);
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .cell:hover { background: #1e293b; transform: scale(1.02); }
    .cell.x { color: #38bdf8; text-shadow: 0 0 15px rgba(56, 189, 248, 0.7); }
    .cell.o { color: #f43f5e; text-shadow: 0 0 15px rgba(244, 63, 94, 0.7); }
    .cell.win { background: rgba(34, 197, 94, 0.25); border-color: #22c55e; }
    .controls {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      width: min(90vw, 380px);
    }
    button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      transition: all 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
  </style>
</head>
<body>
  <div class="hud">
    <div class="title">Tic-Tac-Toe AI</div>
    <div class="status" id="status">You are X (First)</div>
  </div>
  <div id="board"></div>
  <div class="controls">
    <button onclick="resetGame()">Play Again</button>
  </div>

  <script>
    let board = Array(9).fill(null);
    let gameOver = false;
    const HUMAN = 'X';
    const AI = 'O';

    function init() {
      const container = document.getElementById('board');
      container.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.onclick = () => onCellClick(i);
        container.appendChild(cell);
      }
      resetGame();
    }

    function resetGame() {
      board = Array(9).fill(null);
      gameOver = false;
      document.querySelectorAll('.cell').forEach(c => {
        c.innerText = '';
        c.className = 'cell';
      });
      document.getElementById('status').innerText = 'Your Move (X)';
    }

    function onCellClick(i) {
      if (board[i] || gameOver) return;
      makeMove(i, HUMAN);
      if (checkWin(board, HUMAN)) {
        endGame('You Won! Impossible!');
        return;
      }
      if (board.every(Boolean)) {
        endGame('Draw Game!');
        return;
      }
      document.getElementById('status').innerText = 'AI Thinking...';
      setTimeout(() => {
        const bestMove = getBestMove();
        makeMove(bestMove, AI);
        if (checkWin(board, AI)) {
          endGame('AI Won!');
        } else if (board.every(Boolean)) {
          endGame('Draw Game!');
        } else {
          document.getElementById('status').innerText = 'Your Move (X)';
        }
      }, 250);
    }

    function makeMove(i, player) {
      board[i] = player;
      const cell = document.querySelector(`[data-index="${i}"]`);
      cell.innerText = player;
      cell.classList.add(player.toLowerCase());
    }

    function checkWin(b, p) {
      const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      return wins.find(combo => combo.every(idx => b[idx] === p));
    }

    function endGame(msg) {
      gameOver = true;
      document.getElementById('status').innerText = msg;
    }

    function getBestMove() {
      let bestScore = -Infinity;
      let move = -1;
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = AI;
          let score = minimax(board, 0, false);
          board[i] = null;
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    function minimax(b, depth, isMaximizing) {
      if (checkWin(b, AI)) return 10 - depth;
      if (checkWin(b, HUMAN)) return depth - 10;
      if (b.every(Boolean)) return 0;

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = AI;
            let score = minimax(b, depth + 1, false);
            b[i] = null;
            maxEval = Math.max(maxEval, score);
          }
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let i = 0; i < 9; i++) {
          if (!b[i]) {
            b[i] = HUMAN;
            let score = minimax(b, depth + 1, true);
            b[i] = null;
            minEval = Math.min(minEval, score);
          }
        }
        return minEval;
      }
    }

    init();
  </script>
</body>
</html>
